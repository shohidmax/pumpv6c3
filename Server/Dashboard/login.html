<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mutho-Sech Motor Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-base-200 via-base-100 to-base-300 flex items-center justify-center p-4">

    <div class="card w-full max-w-md bg-base-100 shadow-2xl border border-base-300 transition-all duration-300" id="loginCard">
        <div class="card-body p-6 sm:p-8">
            
            <!-- Branding Header -->
            <div class="text-center mb-6">
                <div class="inline-flex p-4 rounded-2xl bg-primary/10 text-primary mb-3 shadow-inner">
                    <!-- Pump / Motor Shield Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-base-content">মুঠো-সেচ কন্ট্রোলার</h1>
                <p class="text-xs font-bold uppercase tracking-wider text-primary mt-1">Smart Motor Control Panel</p>
                <p class="text-xs sm:text-sm opacity-70 mt-2">মোটর কন্ট্রোল প্যানেলে প্রবেশ করতে পাসওয়ার্ড দিন</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                
                <div class="form-control">
                    <label class="label py-1">
                        <span class="label-text font-bold text-sm">সিস্টেম পাসওয়ার্ড (Password)</span>
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="passwordInput" 
                            name="password" 
                            placeholder="পাসওয়ার্ড লিখুন..." 
                            class="input input-bordered w-full pr-11 font-medium focus:input-primary" 
                            required 
                            autofocus 
                            autocomplete="current-password"
                        />
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility('passwordInput', 'eyeIcon')" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-base-content/60 hover:text-primary transition-colors"
                            title="পাসওয়ার্ড দেখুন/লুকান"
                        >
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Error Alert -->
                <div id="errorAlert" class="alert alert-error text-xs py-2.5 hidden flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-4 w-4" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span id="errorMessage">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="btn btn-primary w-full shadow-lg font-bold gap-2 text-base">
                    <span id="btnText">লগইন করুন</span>
                    <span id="btnSpinner" class="loading loading-spinner loading-sm hidden"></span>
                </button>
            </form>

            <div class="divider my-4 text-xs opacity-50">MUTHO-SECH SYSTEM</div>
            <p class="text-center text-xs opacity-60">ডিফল্ট পাসওয়ার্ড: <span class="badge badge-sm badge-ghost font-mono">1234</span></p>
        </div>
    </div>

    <script>
        // Check if already authenticated
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('motor_token');
            if (token) {
                try {
                    const res = await fetch('/api/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    const data = await res.json();
                    if (data && data.valid) {
                        window.location.href = 'index.html';
                    }
                } catch (e) {
                    // Stay on login page
                }
            }
        });

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const loginCard = document.getElementById('loginCard');

            errorAlert.classList.add('hidden');
            submitBtn.disabled = true;
            btnText.textContent = 'যাচাই করা হচ্ছে...';
            btnSpinner.classList.remove('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (res.ok && data.success && data.token) {
                    localStorage.setItem('motor_token', data.token);
                    btnText.textContent = 'সফল! প্রবেশ করা হচ্ছে...';
                    window.location.href = 'index.html';
                } else {
                    errorMessage.textContent = (data && data.message) ? data.message : 'ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।';
                    errorAlert.classList.remove('hidden');
                    loginCard.classList.remove('shake-anim');
                    void loginCard.offsetWidth; // Trigger reflow
                    loginCard.classList.add('shake-anim');
                    document.getElementById('passwordInput').select();
                }
            } catch (err) {
                errorMessage.textContent = 'সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না।';
                errorAlert.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'লগইন করুন';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
